curacao {

  boot-package = "pusachat"

  # Must be longer than pusa-chat.long-poll-timeout, or a long poll that finds no event would
  # be cut off by Curacao before it can return its NOOP.
  async-context-timeout = 1m

  thread-pool {
    # Every client in a room holds one of these threads while it long polls for the next event
    # (up to pusa-chat.long-poll-timeout), so this is roughly the number of connected clients
    # the server can handle at once.
    size = 256
    name-format = "pusachat-%d"
  }

}

# Config overrides belong in a separate file, loaded by passing -Dconfig.file=/path/to/pusachat-dev.conf
# on the command line, e.g. a ~/pusachat-dev.conf of:
#
#   include "application"
#   pusa-chat.dev-mode = true
pusa-chat {

  # Error pages show the error message, and JSON errors include a stack trace.
  dev-mode = false

  # The path the app is served under, e.g. http://127.0.0.1:8080/pusa-chat/
  context-path = "/pusa-chat"

  # Clients that haven't polled for events in this long are removed from their room.
  remove-inactive-users-after = 30s

  # The most recent messages kept per room, shown to clients when they join.
  max-cached-messages-per-room = 50

  # How long a client's request for the next event waits before returning a NOOP, after which
  # the client asks again.
  long-poll-timeout = 20s

}
